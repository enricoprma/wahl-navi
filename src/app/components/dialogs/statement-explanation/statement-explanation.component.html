<div class="dialog-body">
  <div class="px-3 pt-3 d-flex flex-row justify-content-end">
    <button mat-icon-button aria-label="Close dialog" (click)="dialogRef.close()">
      <mat-icon>cancel</mat-icon>
    </button>
  </div>
  <div class="px-5 pb-5 d-flex flex-column">
    <h4 class="m-0">Additional information</h4>
    <hr />
    <p class="m-0" [innerHTML]="data.explanation"></p>
  </div>
</div>
