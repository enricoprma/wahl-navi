<header class="dialog-header">
  <h2 mat-dialog-title>Additional information</h2>
  <button
    type="button"
    mat-icon-button
    cdkFocusInitial
    aria-label="Close additional information"
    (click)="dialogRef.close()"
  >
    <mat-icon>cancel</mat-icon>
  </button>
</header>
<hr />
<mat-dialog-content>
  <p class="m-0" [innerHTML]="data.explanation"></p>
</mat-dialog-content>
